name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests (protocol encoder)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LedSignStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LedSignStudio-apk
          path: LedSignStudio.apk
