name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests (protocol encoder)
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LedSignStudio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LedSignStudio-apk
          path: LedSignStudio.apk
      - name: Publish APK as the "apk" pre-release (overwrites the previous one; HACS ignores pre-releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true   # old tag name, replaced by "apk"
          gh release delete apk -y --cleanup-tag || true
          gh release create apk LedSignStudio.apk --title "LED Sign Studio APK (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On Android: download LedSignStudio.apk and open it to install." \
            --prerelease --latest=false
