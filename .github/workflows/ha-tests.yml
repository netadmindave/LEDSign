name: Home Assistant integration tests

on:
  push:
    paths: ["custom_components/**", "tests/**", ".github/workflows/ha-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component aiousbwatcher pyserial habluetooth bleak-retry-connector bluetooth-adapters bluetooth-auto-recovery pyudev
      - run: pytest -q
